[package]
name = "plexus-dyn"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A Plexus activation that connects to other services at runtime and grows TypeScript dendrites, each served as a peer: dyn.peer.<name>.<path>.<method>."
repository = "https://github.com/hypermemetic-ai/plexus-dyn"
readme = "README.md"
keywords = ["plexus", "rpc", "peer", "dendrite"]

[dependencies]
# NEST-11/NEST-12: plexus-core 0.10.1 (the child's calls back, a child's
# liveness and remount hooks). Every Plexus crate by published version, so a
# clone of plexus-dyn alone builds; developing against sibling checkouts is a
# git-ignored [patch.crates-io] in .cargo/config.toml (hyperforge build link).
# NEST-15: the service root (`DynamicHub::root`), for `top_level`; NEST-16:
# 0.11.0 — needs checked at a graft, `Parent`, the narrowed calls back.
# DYNAUTH-8: `child-wss` — a peer beyond loopback is reached by wss://, its
# certificate validated and its key pinned.
# KEEL-19: 0.11.1 — exchange decided by the service (`exchange_decided`,
# `RemoteChild::may_exchange`), tokens bound to their presenter.
plexus-core = { version = "0.11.1", features = ["child-wss"] }
plexus-macros = "0.11.1"
plexus-client = "0.11.0"
# What #[plexus_macros::activation] expands to names these crates.
async-trait = "0.1"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
plexus-auth-core = "0.3.2"
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
futures = "0.3"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "0.8"
# NEST-21: a peer identity's fingerprint (sha256), as `dyn.repin` takes it.
sha2 = "0.10"
tracing = "0.1"

# DYNAUTH-9: a grown dendrite runs under a Landlock ruleset (the launcher,
# `plexus-dyn-contain`). landlock 0.4.7 knows ABI 9 (Linux 7.1: a UNIX
# socket by path); an older kernel is met best-effort.
# KEEL-19 (KEEL-25): the default data directory names the effective user.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
# DYNAUTH-6: a test peer reads its own token's claims.
base64 = "0.22"
plexus-transport = { version = "0.10", default-features = false, features = ["tls"] }
# DYNAUTH-8: a test CA for the wss:// peer (tests/dyn.rs).
rcgen = "0.14"
tempfile = "3"
# A peer that goes silent (tests/dyn.rs): a raw WebSocket server.
tokio-tungstenite = "0.30"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# DYNAUTH-9: the launcher a grown dendrite is spawned through — beside the
# service's executable or on PATH (`cargo install plexus-dyn --bin
# plexus-dyn-contain`).
[[bin]]
name = "plexus-dyn-contain"
path = "src/bin/plexus-dyn-contain.rs"

[[example]]
name = "dyn_service"

# NEST-12: one runtime for every row (loopback services, a dendrite process).
[[test]]
name = "dyn"
harness = false
